[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-bouncer"
version = "0.1.1"
description = "A local, read-only prompt bouncer that helps coding agents proceed, inspect, or ask."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Repo Bouncer contributors" }]
keywords = ["coding-agents", "prompt-hooks", "repository-context", "preflight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Swif7ify/Repo-Bouncer"
Repository = "https://github.com/Swif7ify/Repo-Bouncer"
Issues = "https://github.com/Swif7ify/Repo-Bouncer/issues"
Changelog = "https://github.com/Swif7ify/Repo-Bouncer/blob/main/CHANGELOG.md"

[project.scripts]
repo-bouncer = "repo_bouncer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
