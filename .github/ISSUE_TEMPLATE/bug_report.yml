name: Bug report
description: Report a reproducible problem with Repo Bouncer.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Please remove private prompts, repository content, credentials, and other sensitive data before submitting.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or setup steps, using a sanitized example prompt and repository if needed.
      placeholder: |
        1. Set up ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, and agent/IDE plus version.
      placeholder: Windows 11, Python 3.12, Cursor version ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove private paths, prompt text, tokens, and credentials.
    validations:
      required: false
